<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Varisca | Modern Fashion & Clothing</title>
  <meta name="title" content="Varisca | Modern Fashion & Clothing" />
  <meta name="description"
    content="Varisca is a modern clothing brand offering stylish, comfortable, and premium-quality fashion for everyday wear." />
  <meta name="author" content="Varisca" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Varisca | Modern Fashion & Clothing" />
  <meta property="og:description"
    content="Discover premium fashion at Varisca. Trend-driven designs, quality fabrics, and timeless style." />
  <!-- Replace with your own brand image -->
  <meta property="og:image" content="/assets/varisca-fashion-og.png" />
  <meta property="og:url" content="https://varisca.in" />
  <link rel="canonical" href="https://varisca.in" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Varisca | Modern Fashion & Clothing" />
  <meta name="twitter:description"
    content="Premium fashion for everyday style. Explore Varisca’s latest clothing collections." />
  <meta name="twitter:image" content="/assets/varisca-fashion-og.png" />
  <meta name="twitter:site" content="@Varisca" />
</head>

<body>
  <div id="root"></div>
  <!-- Ensures live storefront uses api.varisca.in even if a stale bundle has the wrong API URL -->
  <script src="/varisca-api-config.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
